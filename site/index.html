<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CartelTV — Android TV</title>
  <meta name="description" content="CartelTV — a focused Android TV experience.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="theme-color" content="#07090d">
  <link rel="icon" href="assets/mark.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="assets/style.css">
  <script src="assets/app.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="ambient" aria-hidden="true"></div>

  <header class="shell header">
    <a class="brand" href="./" aria-label="CartelTV home">
      <img src="assets/mark.svg" alt="" width="36" height="36">
      <span>CartelTV</span>
    </a>
    <nav class="nav" aria-label="Legal">
      <a href="privacy.html">Privacy</a>
      <a href="terms.html">Terms</a>
    </nav>
  </header>

  <main id="main" class="shell hero">
    <div class="hero-copy">
      <div class="eyebrow"><span class="dot"></span> Android TV</div>
      <h1>Your TV.<br><span>Tuned to you.</span></h1>
      <p class="lede">Live channels, sports, weather, and entertainment — in one focused space.</p>
      <div class="actions">
        <a class="button primary" href="privacy.html">Privacy</a>
        <a class="button" href="terms.html">Terms</a>
      </div>
    </div>

    <div class="orbit" aria-hidden="true">
      <div class="orbit-ring ring-a"></div>
      <div class="orbit-ring ring-b"></div>
      <div class="orbit-ring ring-c"></div>
      <div class="orbit-core">
        <img src="assets/mark.svg" alt="" width="92" height="92">
      </div>
      <div class="orbit-bars">
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
      </div>
    </div>
  </main>

  <section class="shell preview" aria-labelledby="preview-title">
    <div class="preview-head">
      <div>
        <div class="eyebrow">Interface</div>
        <h2 id="preview-title">A closer look.</h2>
      </div>
      <p>Designed for the couch, the remote, and the big screen.</p>
    </div>
    <div class="shots">
      <figure class="shot shot-wide" data-reveal>
        <a href="assets/screenshots/home.png" target="_blank" rel="noopener" aria-label="Open Home screenshot">
          <div class="shot-bar"><span></span><span></span><span></span><small>CartelTV</small></div>
          <img src="assets/screenshots/home.png" alt="CartelTV Home screen" width="1920" height="1080" loading="lazy" decoding="async">
        </a>
        <figcaption>Home</figcaption>
      </figure>
      <figure class="shot" data-reveal>
        <a href="assets/screenshots/sports.png" target="_blank" rel="noopener" aria-label="Open Sports screenshot">
          <div class="shot-bar"><span></span><span></span><span></span><small>CartelTV</small></div>
          <img src="assets/screenshots/sports.png" alt="CartelTV Sports screen" width="1920" height="1080" loading="lazy" decoding="async">
        </a>
        <figcaption>Sports</figcaption>
      </figure>
      <figure class="shot" data-reveal>
        <a href="assets/screenshots/guide.png" target="_blank" rel="noopener" aria-label="Open Live Guide screenshot">
          <div class="shot-bar"><span></span><span></span><span></span><small>CartelTV</small></div>
          <img src="assets/screenshots/guide.png" alt="CartelTV Live Guide screen" width="1920" height="1080" loading="lazy" decoding="async">
        </a>
        <figcaption>Live Guide</figcaption>
      </figure>
    </div>
  </section>

  <footer class="shell footer">
    <span>© 2026 CartelTV</span>
    <div class="footer-right">
      <span>Built for the big screen.</span>
      <button class="motion" type="button" data-motion aria-pressed="true">Motion on</button>
    </div>
  </footer>
</body>
</html>
