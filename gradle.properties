org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
org.gradle.parallel=true
# Build cache disabled: it twice served corrupted/stale dex archives, shipping APKs that were
# missing most app classes (ClassNotFoundException at launch) or silently out of date.
org.gradle.caching=false
org.gradle.configuration-cache=true
kotlin.incremental=true
kotlin.daemon.jvmargs=-Xmx4g
