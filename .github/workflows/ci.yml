name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Compile tools
        run: python -m compileall -q tools
      - name: Install pipeline dependencies
        run: python -m pip install -r tools/pipeline/requirements.txt
      - name: Test tools
        run: python -m unittest discover -s tools -p "test_*.py"

      - name: Check docs
        run: python tools/check_docs.py

      - name: Bug hunt
        run: python tools/bughunt.py --fail-on error

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: ./.github/actions/setup-android
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Unit tests
        env:
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Assemble debug
        run: ./gradlew assembleDebug --stacktrace

      # Unsigned: this only proves R8 and resource shrinking still build. release.yml signs and publishes.
      - name: Assemble release (R8 check)
        run: ./gradlew assembleRelease --stacktrace

      - name: APK size report
        run: |
          {
            echo "### APK sizes"
            echo "| APK | MiB |"
            echo "|---|---|"
            for f in app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk; do
              [ -f "$f" ] && printf '| %s | %.1f |\n' "$(basename "$f")" "$(echo "scale=1; $(stat -c%s "$f")/1048576" | bc)"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
