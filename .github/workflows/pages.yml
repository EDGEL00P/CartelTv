name: pages

on:
  workflow_run:
    workflows: [epg, release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Collect guides
        run: |
          mkdir -p _site/epg
          gh release download epg-latest --repo "$GITHUB_REPOSITORY" --dir _site/epg --pattern '*'

      - name: Collect update manifest
        run: |
          tag=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-pre-releases --json tagName,isLatest --jq '[.[] | select(.tagName != "epg-latest")][0].tagName')
          if [ -n "$tag" ] && [ "$tag" != "null" ]; then
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir _site --pattern update.json || echo "no update.json on $tag"
          fi

      - name: Landing page
        run: |
          {
            echo '<!doctype html><meta charset="utf-8"><title>CartelTV</title>'
            echo '<h1>CartelTV feeds</h1><p><a href="update.json">update.json</a> · <a href="epg/manifest.json">epg/manifest.json</a> · <a href="epg/events.json">epg/events.json</a></p><ul>'
            for f in _site/epg/*.xml.gz; do b=$(basename "$f"); echo "<li><a href=\"epg/$b\">$b</a></li>"; done
            echo '</ul>'
          } > _site/index.html

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
