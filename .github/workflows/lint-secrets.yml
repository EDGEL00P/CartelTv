name: lint-secrets

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: lint-secrets-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  KTLINT_VERSION: "1.8.0"
  KTLINT_SHA256: a3fd620207d5c40da6ca789b95e7f823c54e854b7fade7f613e91096a3706d75

jobs:
  ktlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install ktlint
        run: |
          curl -fsSL -o "$RUNNER_TEMP/ktlint" \
            "https://github.com/pinterest/ktlint/releases/download/${KTLINT_VERSION}/ktlint"
          echo "${KTLINT_SHA256}  $RUNNER_TEMP/ktlint" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/ktlint"

      # Existing violations live in ktlint-baseline.xml; only new ones fail.
      - name: Lint Kotlin
        run: >
          "$RUNNER_TEMP/ktlint" "app/src/**/*.kt" --relative
          --baseline=ktlint-baseline.xml --reporter=plain

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
